<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F20 Look up a case</title>
<style>.err{color:#b00;display:block}#bar{height:6px;background:#2a5;width:0}</style></head><body>
<h1>Look up a case</h1>
<form id="f" novalidate>
<p><label for="case">Case number</label> <input id="case" aria-describedby="case-err"><span class="err" id="case-err" role="alert"></span></p>
<div id="bar"></div>
<p><button type="submit">Look up</button></p>
</form>
<script>
// The page checks the value slowly: a bar grows for 3 seconds, with no text,
// and only then shows its message.
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const bar = document.getElementById("bar"), field = document.getElementById("case");
  const start = Date.now();
  bar.style.width = "1%";
  const tick = setInterval(() => {
    const t = Date.now() - start;
    bar.style.width = Math.min(100, t / 30) + "%";
    if (t < 3000) return;
    clearInterval(tick);
    bar.style.width = "0";
    const ok = /^\d{8}$/.test(field.value);
    document.getElementById("case-err").textContent = ok ? "" : "Case number must be 8 digits.";
    field.setAttribute("aria-invalid", ok ? "false" : "true");
  }, 50);
});
</script></body></html>
