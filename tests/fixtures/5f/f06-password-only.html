<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F06 Confirm it is you</title></head><body>
<h1>Confirm it is you</h1>
<form id="f" novalidate>
<p role="alert" id="msg"></p>
<p><label for="pw">Password</label> <input id="pw" type="password"></p>
<p><button type="submit">Confirm</button></p>
</form>
<script>
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("msg").textContent = "The password you entered is incorrect.";
});
</script></body></html>
