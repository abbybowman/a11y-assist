<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F02 Request a copy</title></head><body>
<h1>Request a copy of your record</h1>

<p><label for="zip">ZIP code</label> <input id="zip" name="zip"></p>

</form></body></html>
