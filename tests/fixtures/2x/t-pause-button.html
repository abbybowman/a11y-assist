<!doctype html>
<html lang="en">
<head><title>Visitor ticker</title></head>
<body>
<main>
<h1>Visitor ticker</h1>
<p>Static text.</p>
<p>More static text.</p>
<p>Still more static text.</p>
<button id="pause">Pause</button>
<div id="tick" style="width: 300px">Visitors today: <span>100</span></div>
<a href="/elsewhere.html">About this count</a>
</main>
<script>
let n = 100;
const timer = setInterval(() => { document.querySelector('#tick span').textContent = ++n; }, 1000);
document.getElementById('pause').addEventListener('click', () => clearInterval(timer));
</script>
</body>
</html>
