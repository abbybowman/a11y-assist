<!doctype html>
<html lang="en">
<head><title>Welcome</title></head>
<body>
<input id="vol" type="range" min="0" max="1" step="0.1" value="1" aria-label="Volume">
<main>
<h1>Welcome</h1>
<p>Static text.</p>
<audio id="a" autoplay loop src="/tone20.wav"></audio>
</main>
<script>document.getElementById('vol').addEventListener('input', (e) => { document.getElementById('a').volume = Number(e.target.value); });</script>
</body>
</html>
