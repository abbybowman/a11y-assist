<!doctype html>
<html lang="en">
<head>
<title>Carousels</title>
<style>
.carousel { width: 300px; height: 80px; border: 1px solid #999; margin: 10px; position: relative; font: 16px sans-serif; }
.carousel .slide { display: none; padding: 20px; }
.carousel .slide.active { display: block; }
#track-wrap { width: 300px; height: 80px; overflow: hidden; border: 1px solid #999; margin: 10px; }
#track { display: flex; width: 900px; transition: transform 0.3s; }
#track > div { width: 300px; flex: none; padding: 20px; box-sizing: border-box; font: 16px sans-serif; }
</style>
</head>
<body>
<main>
<h1>Carousels</h1>
<div class="carousel" id="fade" aria-roledescription="carousel" aria-label="News">
  <div class="slide active">First story</div>
  <div class="slide">Second story</div>
  <div class="slide">Third story</div>
</div>
<div id="track-wrap"><div id="track"><div>Slide one</div><div>Slide two</div><div>Slide three</div></div></div>
</main>
<script>
let k = 0;
setInterval(() => {
  const s = document.querySelectorAll('#fade .slide');
  s[k].classList.remove('active'); k = (k + 1) % s.length; s[k].classList.add('active');
}, 1500);
let j = 0;
setInterval(() => { j = (j + 1) % 3; document.getElementById('track').style.transform = 'translateX(' + (-300 * j) + 'px)'; }, 1500);
</script>
</body>
</html>
