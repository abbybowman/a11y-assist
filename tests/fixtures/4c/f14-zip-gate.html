<!doctype html>
<!-- F14. Expected 4.C: PASS. Proves J2 (gate, value 12345) and M9. -->
<html lang="en">
<head><meta charset="utf-8"><title>F14: ZIP code gate</title></head>
<body>
<h1>Find an office</h1>
<section id="gate" aria-labelledby="gate-title">
  <h2 id="gate-title">Enter your 5-digit ZIP code to see local offices</h2>
  <label for="field">ZIP code (5 digits)</label> <input id="field" type="text" inputmode="numeric" autocomplete="postal-code">
  <button id="go" type="button">Go</button>
  <p id="error" role="alert"></p>
</section>
<div id="results" hidden><p>Offices near you are listed below.</p></div>
<a id="r1" href="#">Office directory</a>
<a id="r2" href="#">Contact us</a>
<script>
  const VALID = (v) => /^[0-9]{5}$/.test(v);
  const ERROR = "Enter a 5-digit ZIP code.";
  // Tab on the last element goes to the first; Shift+Tab on the first goes to
  // the last. Focus never leaves the list by Tab or Shift+Tab.
  function loop(els) {
    els.forEach((el, i) => el.addEventListener("keydown", (e) => {
      if (e.key !== "Tab") return;
      if (!e.shiftKey && i === els.length - 1) { e.preventDefault(); els[0].focus(); }
      else if (e.shiftKey && i === 0) { e.preventDefault(); els[els.length - 1].focus(); }
    }));
  }
  const $ = (id) => document.getElementById(id);
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });
  // Tab and Shift+Tab stay in the gate until a valid value is submitted.
  let gated = true;
  const members = [$("field"), $("go")];
  members.forEach((el, i) => el.addEventListener("keydown", (e) => {
    if (!gated || e.key !== "Tab") return;
    if (!e.shiftKey && i === 1) { e.preventDefault(); members[0].focus(); }
    else if (e.shiftKey && i === 0) { e.preventDefault(); members[1].focus(); }
  }));
  $("go").addEventListener("click", () => {
    if (VALID($("field").value.trim())) {
      gated = false; $("results").hidden = false; $("error").textContent = "";
    } else {
      $("error").textContent = ERROR;
    }
  });
</script>
</body>
</html>
