<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F34: 600 links</title></head>
<body>
<h1>Document library</h1>
<ul id="list"></ul>
<script>
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });
  // 600 links, built before load so the inventory sees all of them.
  const list = document.getElementById("list");
  for (let i = 1; i <= 600; i++) {
    const li = document.createElement("li");
    li.innerHTML = '<a id="d' + i + '" href="#">Document ' + i + "</a>";
    list.appendChild(li);
  }
</script>
</body>
</html>
