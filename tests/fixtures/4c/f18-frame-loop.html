<!doctype html>
<!-- Inner page for F18 and F19 (not a fixture by itself). -->
<html lang="en">
<head><meta charset="utf-8"><title>F18 frame: 2-button loop</title></head>
<body>
<button id="b1" type="button">Frame button 1</button>
<button id="b2" type="button">Frame button 2</button>
<script>
  // Tab on the last element goes to the first; Shift+Tab on the first goes to
  // the last. Focus never leaves the list by Tab or Shift+Tab.
  function loop(els) {
    els.forEach((el, i) => el.addEventListener("keydown", (e) => {
      if (e.key !== "Tab") return;
      if (!e.shiftKey && i === els.length - 1) { e.preventDefault(); els[0].focus(); }
      else if (e.shiftKey && i === 0) { e.preventDefault(); els[els.length - 1].focus(); }
    }));
  }
  const $ = (id) => document.getElementById(id);
  loop([$("b1"), $("b2")]);
</script>
</body>
</html>
