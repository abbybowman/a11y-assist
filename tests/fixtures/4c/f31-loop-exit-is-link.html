<!doctype html>
<!-- F31. Expected 4.C: FAIL. Proves M6 (leaving the page is not an exit). -->
<html lang="en">
<head><meta charset="utf-8"><title>F31: loop whose only exit is a link to another page</title></head>
<body>
<h1>Loop with a page link</h1>
<a id="before" href="#">Before</a>
<div role="toolbar" aria-label="Tools">
  <button id="t1" type="button">Bold</button>
  <button id="t2" type="button">Italic</button>
  <a id="t3" href="f31-other-page.html">Help (opens another page)</a>
</div>
<a id="after" href="#">After</a>
<script>
  // Tab on the last element goes to the first; Shift+Tab on the first goes to
  // the last. Focus never leaves the list by Tab or Shift+Tab.
  function loop(els) {
    els.forEach((el, i) => el.addEventListener("keydown", (e) => {
      if (e.key !== "Tab") return;
      if (!e.shiftKey && i === els.length - 1) { e.preventDefault(); els[0].focus(); }
      else if (e.shiftKey && i === 0) { e.preventDefault(); els[els.length - 1].focus(); }
    }));
  }
  const $ = (id) => document.getElementById(id);
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });
  loop([$("t1"), $("t2"), $("t3")]);
</script>
</body>
</html>
