<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F01: paragraphs and 10 links</title></head>
<body>
<h1>Office locations</h1>
<p>Find an office near you. Each link below opens details for one region.</p>
<p>Offices are open Monday to Friday.</p>
  <a id="l1" href="#">Link 1</a>
  <a id="l2" href="#">Link 2</a>
  <a id="l3" href="#">Link 3</a>
  <a id="l4" href="#">Link 4</a>
  <a id="l5" href="#">Link 5</a>
  <a id="l6" href="#">Link 6</a>
  <a id="l7" href="#">Link 7</a>
  <a id="l8" href="#">Link 8</a>
  <a id="l9" href="#">Link 9</a>
  <a id="l10" href="#">Link 10</a>
<p>Last updated in 2026.</p>
<script>
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });
</script>
</body>
</html>
