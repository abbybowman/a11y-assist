<!doctype html>
<!-- F03. Expected 4.C: DOES NOT APPLY (the gap belongs to 4.A). Proves A4. -->
<html lang="en">
<head><meta charset="utf-8"><title>F03: clickable div only</title></head>
<body>
<h1>Show details</h1>
<div id="toggle" style="cursor:pointer;text-decoration:underline">Show details</div>
<p id="details" hidden>Details shown by mouse only.</p>
<script>
  document.getElementById("toggle").addEventListener("click", () => {
    document.getElementById("details").hidden = false;
  });
</script>
</body>
</html>
