<!doctype html>
<!-- Inner page for F21 (not a fixture by itself). -->
<html lang="en">
<head><meta charset="utf-8"><title>F21 frame: player that lets Tab out</title></head>
<body>
<div role="group" aria-label="Video player">
  <button id="play" type="button">Play</button>
  <button id="mute" type="button">Mute</button>
  <label for="vol">Volume</label> <input id="vol" type="range" min="0" max="10" value="5">
  <button id="fs" type="button">Full screen</button>
</div>
</body>
</html>
