<!doctype html>
<!-- F18. Expected 4.C: FAIL. Proves the iframe rule. -->
<html lang="en">
<head><meta charset="utf-8"><title>F18: loop in a same-origin iframe</title></head>
<body>
<h1>Same-origin frame</h1>
<a id="before" href="#">Before the frame</a>
<iframe id="frame" title="Buttons" src="f18-frame-loop.html" width="400" height="120"></iframe>
<a id="after" href="#">After the frame</a>
<script>
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });
</script>
</body>
</html>
