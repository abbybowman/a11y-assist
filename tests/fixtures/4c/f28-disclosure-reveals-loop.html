<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F28: disclosure button revealing a loop</title></head>
<body>
<h1>Disclosure</h1>
<a id="before" href="#">Before</a>
<button id="toggle" type="button" aria-expanded="false" aria-controls="region">More links</button>
<div id="region" hidden>
  <a id="d1" href="#">Hidden link 1</a>
  <a id="d2" href="#">Hidden link 2</a>
  <a id="d3" href="#">Hidden link 3</a>
</div>
<a id="after" href="#">After</a>
<script>
  // Tab on the last element goes to the first; Shift+Tab on the first goes to
  // the last. Focus never leaves the list by Tab or Shift+Tab.
  function loop(els) {
    els.forEach((el, i) => el.addEventListener("keydown", (e) => {
      if (e.key !== "Tab") return;
      if (!e.shiftKey && i === els.length - 1) { e.preventDefault(); els[0].focus(); }
      else if (e.shiftKey && i === 0) { e.preventDefault(); els[els.length - 1].focus(); }
    }));
  }
  const $ = (id) => document.getElementById(id);
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });
  $("toggle").addEventListener("click", () => {
    const open = $("toggle").getAttribute("aria-expanded") === "true";
    $("toggle").setAttribute("aria-expanded", String(!open));
    $("region").hidden = open;
  });
  loop([$("d1"), $("d2"), $("d3")]);
</script>
</body>
</html>
