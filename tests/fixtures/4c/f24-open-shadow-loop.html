<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F24: loop inside an open shadow root</title></head>
<body>
<h1>Open shadow root</h1>
<a id="before" href="#">Before</a>
<div id="host"></div>
<a id="after" href="#">After</a>
<script>
  // Tab on the last element goes to the first; Shift+Tab on the first goes to
  // the last. Focus never leaves the list by Tab or Shift+Tab.
  function loop(els) {
    els.forEach((el, i) => el.addEventListener("keydown", (e) => {
      if (e.key !== "Tab") return;
      if (!e.shiftKey && i === els.length - 1) { e.preventDefault(); els[0].focus(); }
      else if (e.shiftKey && i === 0) { e.preventDefault(); els[els.length - 1].focus(); }
    }));
  }
  const $ = (id) => document.getElementById(id);
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });
  const root = $("host").attachShadow({ mode: "open" });
  root.innerHTML =
    '<button id="s1">Shadow 1</button><button id="s2">Shadow 2</button><button id="s3">Shadow 3</button>';
  loop(["s1", "s2", "s3"].map((id) => root.getElementById(id)));
</script>
</body>
</html>
