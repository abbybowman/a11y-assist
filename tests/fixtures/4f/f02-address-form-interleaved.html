<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F02 address form interleaved</title><style>.cols{display:flex;gap:2em}</style></head><body>
<form class="cols"><fieldset><legend>Mailing address</legend>
<p><label>Name <input id="name" tabindex="1"></label></p><p><label>Street <input id="street" tabindex="3"></label></p><p><label>City <input id="city" tabindex="5"></label></p></fieldset>
<fieldset><legend>Newsletters</legend><p><label><input type="checkbox" id="n1" tabindex="2"> Weekly</label></p><p><label><input type="checkbox" id="n2" tabindex="4"> Monthly</label></p><p><label><input type="checkbox" id="n3" tabindex="6"> Alerts</label></p></fieldset></form></body></html>
