<!doctype html><html lang="en"><head><meta charset="utf-8"><title>F15 Missions</title></head><body>
<h1>Missions</h1>
<form onsubmit="return false">
<fieldset><legend>Mission status</legend>
<label><input type="checkbox" name="status" value="active"> Active</label>
<label><input type="checkbox" name="status" value="future"> Future</label>
<label><input type="checkbox" name="status" value="past"> Past</label>
<label><input type="checkbox" name="status" value="inactive"> Inactive</label>
</fieldset>
</form>
<p><a href="#help">Help</a></p>
<script>
for (const box of document.querySelectorAll("input[name=status]")) {
  box.addEventListener("change", (e) => {
    location.href = "f01-other.html?status=" + e.target.value;
  });
}
</script></body></html>
