<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Form controls</title></head><body>
<form id="f">
<label>Name <input id="name"></label>
<label>Email <input id="email" type="email"></label>
<label>Code <input id="code" readonly value="X1"></label>
<label>Off <input id="off" disabled></label>
<fieldset><legend>Size</legend><label><input type="radio" name="size" id="s1"> S</label><label><input type="radio" name="size" id="s2"> M</label></fieldset>
<label><input type="checkbox" id="news"> News</label>
<label>State <select id="state"><option>A</option><option>B</option></select></label>
<label>Notes <textarea id="notes"></textarea></label>
<div role="slider" id="vol" tabindex="0" aria-valuenow="5" aria-valuemin="0" aria-valuemax="10" aria-label="Volume"></div>
<div role="switch" id="dark" tabindex="0" aria-checked="false" aria-label="Dark mode"></div>
<button type="submit">Send</button>
</form>
</body></html>
