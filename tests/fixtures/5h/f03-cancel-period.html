<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Order publications: step 2 of 2</title></head><body>
<main><h1>Order printed publications: step 2 of 2</h1><form id="f"><p><label for="nm">Name on card</label> <input id="nm" name="nm"></p><p><label for="amt">Amount in dollars</label> <input id="amt" name="amt"></p><button type="submit">Place order</button></form><div id="out" hidden tabindex="-1"></div></main>

</body></html>
