        - paragraph [ref=f12e294]:
          - strong [ref=f12e295]: Federal merit system principles emphasize that the Federal Government should strive to build a workforce reflective of all segments of society. At NASA, we are committed to recruiting and hiring the most talented individuals from all backgrounds and life experiences, representative of our nation’s population.
