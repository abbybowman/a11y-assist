        - heading "How do I spot the International Space Station?" [level=1] [ref=e234]
        - paragraph [ref=e236]:
          - strong [ref=e237]: Time
          - text: is when the sighting opportunity will begin in the local time zone of a user’s preferred location. All International Space Station sightings will occur within a few hours before or after sunrise or sunset. This is the optimum viewing period as the Sun reflects off the space station and contrasts against the darker sky.
        - paragraph [ref=e238]:
          - strong [ref=e239]: Above the Horizon
          - text: is the amount of time the space station is visible before crossing back below the Earth’s horizon.
        - paragraph [ref=e240]:
          - strong [ref=e241]: Maximum Height
          - text: is measured in degrees (also known as elevation). It represents the height of the space station from Earth’s horizon. The horizon is at zero degrees, and directly overhead is 90 degrees.
        - paragraph [ref=e242]:
          - strong [ref=e243]: Appears
          - text: is where the space station will be visible first. This value, like maximum height, also is measured in degrees from the horizon. The letters represent compass directions.
        - paragraph [ref=e244]:
          - strong [ref=e245]: Disappears
          - text: represents the location where the space station will leave a user’s field of view.
        - paragraph [ref=e246]: The space station orbits with an inclination of 51.6 degrees. This means that, as it orbits, the farthest north and south of the equator it will go is 51.6 degrees latitude. If a user’s preferred location is north or south of 51.6 degrees, the station will never go directly overhead, this includes places like Alaska. The app may not properly inform users of all visible station passes in these locations. The app provides a list of all possible space station viewing opportunities for a user’s preferred location under the “Next Sighting(s) List” located on the homepage.
        - paragraph [ref=e247]: The space station appears similar to an airplane or a very bright star moving across the night sky, except it does not have flashing lights or change direction. It also moves faster than a typical airplane (airplanes fly at about 600 mph (965 kph); the space station flies at 17,500 mph (28,000 kph)).
        - generic [ref=e252]:
          - generic [ref=e253]:
