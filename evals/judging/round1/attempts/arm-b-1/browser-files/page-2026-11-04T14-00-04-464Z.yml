            - heading "International Space Station" [level=2] [ref=e255]
            - generic:
              - paragraph
            - paragraph [ref=e256]: The International Space Station is a convergence of science, technology, and human innovation that enables research not possible on Earth for the benefit of humanity. For over 25 years, NASA has supported a continuous U.S. human presence aboard the station, through which astronauts have learned to live and work in space for extended periods of time.
            - link "Learn More about International Space Station" [ref=e257] [cursor=pointer]:
              - /url: https://www.nasa.gov/international-space-station/
          - generic [ref=e264]:
            - figure [ref=e265]
            - generic [ref=e266]: "NASA astronaut Butch Wilmore works outside the International Space Station during a spacewalk. The space station was orbiting into a sunset 259 miles above Eastern Europe (Credit: NASA)."
        - generic [ref=e271]:
