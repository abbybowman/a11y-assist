          - generic [ref=e275]: "As the International Space Station soared some 250 miles above Lake Michigan, NASA astronaut Don Pettit captured this long-exposure photograph of city lights streaking across Earth as a green and red aurora moved through the atmosphere (Credit: NASA)."
        - heading "International Space Station Trajectory Data" [level=1] [ref=e277]
        - paragraph [ref=e279]: NASA’s flight controllers in the International Space Station Mission Control Center at the agency’s Johnson Space Center in Houston generate the space stations trajectory data as passes over Earth at 17,500 miles per hour. The flight controllers, or International Space Station Trajectory Operations and Planning Officer, track the station’s current location, course, and potential collisions risks with other objects in orbit.
        - paragraph [ref=e280]: At the station’s altitude, the thin atmosphere of Earth creates drag and can cause the projected trajectory to accumulate minor errors. To track the most accurate course, flight controllers update the data on the station’s trajectory approximately three times a week. An accurate trajectory is essential for maintaining communications links and planning visiting spacecraft rendezvous.
        - paragraph [ref=e281]:
          - text: NASA provides the station’s current trajectory data for public use within the Consultative Committee for Space Data Systems standard. The Orbit Ephemeris Message is available in
          - link ".txt" [ref=e282] [cursor=pointer]:
            - /url: https://nasa-public-data.s3.amazonaws.com/iss-coords/current/ISS_OEM/ISS.OEM_J2K_EPH.txt
          - text: and
          - link ".xml" [ref=e283] [cursor=pointer]:
            - /url: https://nasa-public-data.s3.amazonaws.com/iss-coords/current/ISS_OEM/ISS.OEM_J2K_EPH.xml
          - text: formats and contains header lines with the space station’s mass in kilograms, drag area in meters squared, drag coefficient, and a list of upcoming station maneuvers, and spacecraft launches, arrivals, and departures. Each file also includes details for the first and last ascending nodes, the point where the station’s orbit crosses the Earth’s equator moving from south to north.
        - paragraph [ref=e284]: The station’s state vectors in the mean of J2000 reference frame are listed at four-minute intervals spanning a total length of 15 days. During reboosts, the state vectors are reported in two-second intervals. Each state vector lists the time in Coordinated Universal Time; position x, y, and z in kilometers per second; and velocity x, y, and z in kilometers per second.
        - paragraph [ref=e285]:
          - text: Users of this data should monitor this page for additional information or changes to the file format. Past data is archived on
          - link "data.nasa.gov" [ref=e286] [cursor=pointer]:
            - /url: http://data.nasa.gov
          - text: and found by searching “ISS COORDS.”
        - paragraph [ref=e287]: NASA provides this information for use by the public. The mobile application’s open-source code enables anyone to modify and use the code for their projects and support the tool’s growth. The Orbit Ephemeris Message data format is supported natively by many commercial spaceflight software applications. Please consult the application’s support documentation for specific details on how to deploy this data.
