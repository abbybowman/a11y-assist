              - generic [ref=f20e366]: The historic X-1E rocket plane is seen on display in front of the original National Advisory Committee on Aeronautics operations facility at Edwards Air Force Base, Calif. In this 2010 image, this is the “front door” to NASA’s Dryden Flight Research Center, now known as NASA’s Armstrong Flight Research Center.
              - generic [ref=f20e367]: NASA / Jim Banke
        - generic [ref=f20e368]:
          - generic [ref=f20e372]:
            - heading "End of an Era and a New Beginning" [level=3] [ref=f20e374]
            - paragraph [ref=f20e375]: From 1915 to 1958, the NACA led the world in aviation research. During this golden age of aeronautical innovation, air travel evolved from small wood and fabric airplanes flying a few hundred feet high to rocket-propelled aircraft built from exotic metals cruising to the edge of space. The commercial jet age was taking off and the promise of supersonic airliners was just beyond the horizon. When the Soviet Union shocked the world with Sputnik in 1957, the U.S. reacted by creating a new agency in 1958 to research and develop the technology required to win the “Space Race.” The nation looked to the experienced experts at the NACA to form the foundation of the new National Aeronautics and Space Administration. The NACA was no more, but its rich heritage of research excellence lives on today within NASA’s Aeronautics Research Mission Directorate.
