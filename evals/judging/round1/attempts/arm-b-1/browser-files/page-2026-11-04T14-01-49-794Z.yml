            - generic [ref=f20e396]:
              - generic [ref=f20e397]: In 1946 the Lewis Flight Propulsion Laboratory became the NACA’s official icing research center. Lewis pilots flew the B-24M and XB-25E into perilous weather conditions all across the country to study both deicing technologies and the physics of ice-producing clouds. These dangerous flights led to advances in weather sensing instruments and flight planning.
