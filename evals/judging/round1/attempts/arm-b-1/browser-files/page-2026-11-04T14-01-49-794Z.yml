              - generic [ref=f20e154]: A Curtis Hawk AT-5A equipped with an NACA cowling is seen in October 1928 at the Langley Memorial Aeronautical Laboratory in Virginia. The cowling was an early, award-winning innovation developed by the National Advisory Committee for Aeronautics, the predecessor of NASA.
