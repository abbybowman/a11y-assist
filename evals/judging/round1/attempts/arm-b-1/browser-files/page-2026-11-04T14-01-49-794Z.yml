            - heading "An Immediate Difference" [level=2] [ref=f20e146]
            - paragraph [ref=f20e147]: Despite unassuming beginnings, NACA researchers wasted no time setting the gold standard for aeronautical innovations, many of which became the basis for aviation technologies still in use today.One of the earliest advances was the NACA cowling, an aerodynamically efficient engine cover that improved aircraft performance, fuel efficiency, and safety. It made such a difference that in 1929 the technology and its inventors were awarded the Collier Trophy, aviation’s highest honor.
