            - heading "Doing Things Big" [level=2] [ref=f20e210]
            - paragraph [ref=f20e211]: The laid back West Coast culture didn’t keep researchers at Ames from making urgent, big strides in aviation during and after World War II with the help of what was then the world’s largest wind tunnel, which opened in 1944.Achievements at Ames were many, with notable ones including design improvements to the P-51 Mustang fighter that helped win the war, and a Collier Award-winning method for preventing fatal ice build up on wings.
