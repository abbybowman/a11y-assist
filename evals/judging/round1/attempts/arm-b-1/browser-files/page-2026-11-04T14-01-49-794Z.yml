              - paragraph [ref=f20e249]: Chapter 4
              - heading "ENGINES" [level=2] [ref=f20e250]
              - paragraph [ref=f20e251]: The desire for airplanes — and eventually rockets — to fly faster, higher, and farther meant the NACA needed new ideas and research capabilities for improving propulsion. The solutions would be found in a new engine laboratory set up in Ohio.
            - generic [ref=f20e253]:
              - figure [ref=f20e254]:
                - img "Technician cleans a pitot tube on a ramjet in a wind tunnel" [ref=f20e255]
              - generic [ref=f20e256]:
                - generic [ref=f20e257]: An NACA technician cleans a component of an experimental ramjet in the 8-foot by 6-foot supersonic wind tunnel in 1950 at what was then known as the Lewis Flight Propulsion Laboratory in Cleveland.
                - generic [ref=f20e258]: NACA
          - generic [ref=f20e260]: Scroll to Continue
        - generic [ref=f20e270]:
          - generic [ref=f20e272]:
            - heading "Moving Right Along" [level=2] [ref=f20e273]
            - paragraph [ref=f20e274]: From the NACA’s engine laboratory’s start in 1941, each decade saw propulsion advancements that began with piston-driven propellers; continued on with turbojets, pure jets, and ramjets; and then moved on to rocket engines to power the Space Age.
          - generic [ref=f20e277]:
            - figure [ref=f20e278]:
              - img "Close up view of the front of a jet engine." [ref=f20e279]
            - generic [ref=f20e280]: National Aeronautics and Space Administration (NASA) Convair F-106B Delta Dart with a 32-spoke nozzle installed on its General Electric J85 test engine. Lewis acquired a Delta Dart fighter in 1966 to study the components for propulsion systems that could be applied to supersonic transport aircraft at transonic speeds. The F-106B was modified with two General Electric J85-13 engines under its wings to study these components. The original test plan was expanded to include the study of boattail drag, noise reduction, and inlets. From February to July 1971 the modified F-106B was used to study different ejector nozzles. Researchers conducted both acoustic and aerodynamic tests on the ground and in flight. Several models were created to test different suppression methods. NASA Lewis’ conical nozzle was used as the baseline configuration. Flightline and sideline microphones were set up on the ground. The F-106B would idle its own engine and buzz the recording station from an altitude of 300 feet at Mach 0.4 with the test engines firing. Researchers found that the suppression of the perceived noise level was usually lower during flight than the researchers had statistically predicted. The 64 and 32-spoke nozzles performed well in actual flight, but the others nozzles tended to negatively affect the engine’s performance. Different speeds or angles- -of-attack sometimes changed the noise levels. In the end, no general conclusions could be applied to all the nozzles.
