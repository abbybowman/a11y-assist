            - heading "X Marks the Spot" [level=2] [ref=f20e336]
            - paragraph [ref=f20e337]: From the X-1 in 1947 to the upcoming flights of the X-59 and X-66, experimental aircraft — X-planes — have been a staple of flight test operations at what is now Armstrong Flight Research Center. Work done by the NACA through 1958 and NASA ever since, not only with X-planes but research aircraft of all sorts, has advanced our understanding of all things aeronautics, making air travel one of the safest modes of transportation.
