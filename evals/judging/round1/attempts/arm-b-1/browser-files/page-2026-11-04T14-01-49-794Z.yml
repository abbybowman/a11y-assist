              - paragraph [ref=f20e80]: Chapter 1
              - heading "PRELUDE" [level=2] [ref=f20e81]
              - paragraph [ref=f20e82]: The Wright Brothers made history with their 1903 flight, but U.S. leadership in aviation during the next decade fell behind as Europe invested in aeronautical research before the first world war.
            - generic [ref=f20e84]:
              - figure [ref=f20e85]:
                - img "Wright Brothers First Flight" [ref=f20e86]
              - generic [ref=f20e87]: On December 17, 1903, two brothers from Dayton, Ohio, named Wilbur and Orville Wright, were successful in flying an airplane they built. Their powered aircraft flew for 12 seconds above the sand dunes of Kitty Hawk, North Carolina.
          - generic [ref=f20e90]: Scroll to Continue
        - generic [ref=f20e100]:
          - generic [ref=f20e102]:
            - heading "The U.S. Answers with the NACA" [level=2] [ref=f20e103]
            - paragraph [ref=f20e104]: The U.S. responded to Europe’s aeronautical trailblazing in 1915 by forming a committee of government, military, and industry leaders. It was called the National Advisory Committee for Aeronautics, or the NACA — with each letter pronounced.The NACA contributed to some of the most important advancements in the history of flight. And its people, its laboratories, and legacy, became the basis for NASA at the dawn of the Space Age.
