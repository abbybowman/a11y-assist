                      - listitem [ref=f30e240]: Nicky Fox, associate administrator for Science, NASA Headquarters
                      - listitem [ref=f30e241]: Dayna Ise, acting director, Utility and Infrastructure Office, Moon Base Program
                  - listitem [ref=f30e242]: NASA subject matter experts will be available for one-on-one interviews following this announcement.
            - paragraph [ref=f30e243]:
              - strong [ref=f30e244]: Sunday, Nov. 8
