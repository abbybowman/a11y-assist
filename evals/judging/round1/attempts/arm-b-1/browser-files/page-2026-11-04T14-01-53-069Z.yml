                  - img "Looking up, three white and black fighter jets fly in formation across a bright, blue sky." [ref=f30e165]
              - generic [ref=f30e166]:
                - generic [ref=f30e167]: NASA’s Freedom 250 F-5 team, including NASA Administrator Jared Isaacman, performs a flyover during the national anthem at an NFL game between the Cleveland Browns and the Carolina Panthers at Huntington Bank Field, Sept. 27, 2026, in Cleveland.
                - generic [ref=f30e168]: "Credit: NASA/Jordan Cochran"
            - paragraph [ref=f30e169]: America’s newest aerospace expo and air show – MAX POWER – is fast approaching, and NASA has announced key events beginning Friday, Nov. 6, and running through Sunday, Nov. 8, hosted on and near the agency’s Kennedy Space Center in Florida.
            - paragraph [ref=f30e170]:
              - text: Through multiple park experiences at
              - link "MAX POWER" [ref=f30e171] [cursor=pointer]:
                - /url: https://www.nasa.gov/maxpower
              - text: ", NASA and a variety of external collaborators will showcase the newest aircraft, autonomous vehicles, technologies, and more defining the future of air and space. NASA will display its quiet supersonic X-59 plane, and agency partners will showcase Moon rovers, spacecraft, and more. The expo also is a culmination of the agency’s recent"
              - link "Inspiration Tour" [ref=f30e172] [cursor=pointer]:
                - /url: https://www.nasa.gov/news-release/nasa-nfl-team-up-to-showcase-space-aeronautics-innovation/
              - text: ", which included numerous flyovers to highlight NASA’s fleet of aircraft."
            - paragraph [ref=f30e173]:
              - text: A current schedule of events is available on the agency’s
              - link "website" [ref=f30e174] [cursor=pointer]:
                - /url: https://www.nasa.gov/maxpower
              - text: .
            - paragraph [ref=f30e175]: MAX POWER includes opportunities to meet leadership, astronauts, engineers, scientists, and other subject matter experts during the family-friendly public events with gates opening at 9 a.m. EST on Nov. 7 and Nov. 8.
            - paragraph [ref=f30e176]:
              - text: NASA also will share multiple news updates during the weekend, including hosting a news conference at 5 p.m. on Nov. 7, to provide its latest Moon Base update. Located near the lunar South Pole, the
              - link "Moon Base" [ref=f30e177] [cursor=pointer]:
                - /url: https://www.nasa.gov/moonbase
              - text: is humanity’s first outpost for long-term lunar exploration.
            - paragraph [ref=f30e178]: "Live coverage of the news conference will stream on a variety of platforms online. Learn where to watch:"
            - paragraph [ref=f30e179]:
              - link "https://www.nasa.gov/live" [ref=f30e180] [cursor=pointer]:
                - /url: https://www.nasa.gov/live
            - paragraph [ref=f30e181]:
              - strong [ref=f30e182]: Join NASA for Key Events
            - paragraph [ref=f30e183]:
              - text: "Media credentialing for this event is closed. Media approved for this event must request interviews in advance. Space in the news conference is limited, and first come, first served. Media also may participate in the news conference virtually. To request call details or an interview, please contact Lauren Low in the NASA Headquarters newsroom at:"
              - link "lauren.e.low@nasa.gov" [ref=f30e184] [cursor=pointer]:
                - /url: mailto:lauren.e.low@nasa.gov
              - text: .
            - paragraph [ref=f30e185]: A short list of key NASA activities during MAX POWER are listed below. All times are listed in Eastern Standard Time, and are subject to change.
            - paragraph [ref=f30e186]:
              - strong [ref=f30e187]: "Friday, Nov. 6:"
            - list [ref=f30e188]:
              - listitem [ref=f30e189]:
                - text: "2 p.m., to 4 p.m.: Media one-on-one opportunities to preview weekend MAX POWER activities"
                - list [ref=f30e190]:
                  - listitem [ref=f30e191]: "Location: NASA Press Site"
            - paragraph [ref=f30e192]:
              - strong [ref=f30e193]: "Saturday, Nov. 7:"
            - list [ref=f30e194]:
              - listitem [ref=f30e195]:
                - text: "10 a.m.: Nuclear NASA media gaggle"
                - list [ref=f30e196]:
                  - listitem [ref=f30e197]: "Location: UP.Summit Main Stage"
                - list [ref=f30e198]:
                  - listitem [ref=f30e199]: Cynthia Simmons, director, Space Reactors Division
            - list [ref=f30e200]:
              - listitem [ref=f30e201]:
                - text: "11:30 a.m.: Opening air show remarks featuring NASA Deputy Administrator Matt Anderson"
                - list [ref=f30e202]:
                  - listitem [ref=f30e203]: "Location: Air Dot Show Main Stage"
            - list [ref=f30e204]:
              - listitem [ref=f30e205]: "11:58 a.m.: F-5 flyover in the Air Dot Show featuring NASA Administrator Jared Isaacman"
            - list [ref=f30e206]:
              - listitem [ref=f30e207]:
                - text: "12:45 p.m.: Meet the Astronauts: NASA’s Artemis III Crew"
                - list [ref=f30e208]:
                  - listitem [ref=f30e209]: "Location: Air Dot Show Main Stage"
                - list [ref=f30e210]:
                  - listitem [ref=f30e211]:
                    - text: "Participants include:"
                    - list [ref=f30e212]:
                      - listitem [ref=f30e213]: NASA astronaut Randy Bresnik (mission commander)
                    - list [ref=f30e214]:
                      - listitem [ref=f30e215]: ESA (European Space Agency) astronaut Luca Parmitano (pilot)
                    - list [ref=f30e216]:
                      - listitem [ref=f30e217]: NASA astronaut Frank Rubio (mission specialist)
                    - list [ref=f30e218]:
                      - listitem [ref=f30e219]: NASA astronaut Bob Hines, backup crew member
                - list [ref=f30e220]:
                  - listitem [ref=f30e221]: NASA will host a media gaggle with crew immediately following this event.
            - list [ref=f30e222]:
              - listitem [ref=f30e223]: "1:31 p.m.: MiG-29 flyover featuring Isaacman"
            - list [ref=f30e224]:
              - listitem [ref=f30e225]:
                - text: "2 p.m.: Learn about NASA’s Roman Space Telescope"
                - list [ref=f30e226]:
