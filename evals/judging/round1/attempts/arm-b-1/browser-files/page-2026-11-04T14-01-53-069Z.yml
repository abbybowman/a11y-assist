                    - list [ref=f30e230]:
                      - listitem [ref=f30e231]: Remarks by Julie McEnery, senior project scientist, Nancy Grace Roman Space Telescope, NASA Goddard
              - listitem [ref=f30e232]:
                - text: 5 p.m. Moon Base News Conference
                - list [ref=f30e233]:
