          - heading "Kennedy Space Center History" [level=1] [ref=f36e44]
          - paragraph [ref=f36e45]: After acquiring land along the Florida coast in the 1960s, NASA established as an independent field center located on Merritt Island on March 7, 1962, becoming the agency's launch site for hundreds of human space flight missions, and scientific, commercial, and applications spacecraft.
