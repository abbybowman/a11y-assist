<!doctype html><title>det</title><style>
.b{display:inline-block;width:140px;height:100px;margin:6px;vertical-align:top;border:1px solid #ccc;overflow:hidden;font:14px sans-serif}
@keyframes spin{to{transform:rotate(360deg)}} .sp{width:30px;height:30px;background:#c00;margin:30px;animation:spin 2s linear infinite}
.sp3{width:30px;height:30px;background:#00c;margin:30px;animation:spin 1s linear 3}
</style>
<p>Static intro text that never changes.</p>
<div class=b id=css-inf><div class=sp></div></div>
<div class=b id=css-3s><div class=sp3></div></div>
<div class=b id=marq><marquee>Scrolling marquee text</marquee></div>
<div class=b id=gif-long><img src="long.gif"></div>
<div class=b id=gif-once><img src="once.gif"></div>
<div class=b id=canvas><canvas id=cv width=140 height=100></canvas></div>
<div class=b id=video><video src="loop.webm" autoplay muted loop width=140></video></div>
<div class=b id=ticker>Count: <span id=t>0</span></div>
<div class=b id=slow>Slide A</div>
<div class=b id=spinner><div class=sp></div></div>
<div class=b id=jsscroll><div id=sc style="white-space:nowrap;overflow:hidden;width:140px"><span>News: lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor</span></div></div>
<div class=b id=field><input autofocus value="caret here"></div>
<script>
let i=0;setInterval(()=>{document.getElementById('t').textContent=++i},1000);
setInterval(()=>{const s=document.getElementById('slow');s.textContent=s.textContent=='Slide A'?'Slide B':'Slide A'},8000);
setTimeout(()=>document.querySelector('#spinner .sp').remove(),2000);
const cv=document.getElementById('cv').getContext('2d');let x=0;(function f(){cv.clearRect(0,0,140,100);cv.fillRect(x%140,40,20,20);x+=2;requestAnimationFrame(f)})();
const sc=document.getElementById('sc');setInterval(()=>{sc.scrollLeft=(sc.scrollLeft+3)%300},50);
const ac=new AudioContext();const o=ac.createOscillator();o.connect(ac.destination);o.start();
</script>
