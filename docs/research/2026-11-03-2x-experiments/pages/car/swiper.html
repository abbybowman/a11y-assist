<!doctype html><html><head><title>swiper</title><link rel=stylesheet href=https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css><style>body{margin:0}#c{width:400px;margin:10px}</style></head><body><a href="#top">Top link</a> <button>Before</button>
<div id=c><div class=swiper><div class=swiper-wrapper><div class="swiper-slide"><div style="height:120px;background:#c33;color:#fff">Slide 1</div></div><div class="swiper-slide"><div style="height:120px;background:#3c3">Slide 2</div></div><div class="swiper-slide"><div style="height:120px;background:#33c;color:#fff">Slide 3</div></div></div><div class=swiper-button-prev></div><div class=swiper-button-next></div></div></div><button>After 1</button><button>After 2</button><p>Other content.</p><script src=https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js></script><script>new Swiper('.swiper',{loop:true,speed:200,autoplay:{delay:1500},navigation:{nextEl:'.swiper-button-next',prevEl:'.swiper-button-prev'}})</script></body></html>
